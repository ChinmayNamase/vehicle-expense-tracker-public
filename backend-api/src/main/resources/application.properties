# ---------------------------------------------------------------------------
# Vehicle Expense Tracker - Java server (own API + own database + website)
# Secrets are NEVER written here; they come from environment variables.
# ---------------------------------------------------------------------------
spring.application.name=vehicle-tracker-api
# "local" = own H2 database stored in backend-api/data/ (default)
# "demo"  = in-memory database with sample data (used by the tests)
spring.profiles.default=local
server.port=${PORT:8081}

# Admin login for the admin page, admin API and Swagger UI
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin12345}
app.sql.user-name-expression=u.full_name
# Other websites allowed to call the API (comma-separated), e.g. the Vercel site
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# How long a website login stays valid
app.session.days=30

# API documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
