# ---------------------------------------------------------------------------
# DEMO profile: in-memory H2 database filled with sample data on every start.
# Used by the automated tests; nothing is saved.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:vehicletracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo/reset.sql,classpath:db/schema.sql
spring.sql.init.data-locations=classpath:demo/data.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
