# ---------------------------------------------------------------------------
# LOCAL profile: our OWN database, an H2 database file in backend-api/data/
# Data is kept between restarts. Tables are created on first start.
# Database console: http://localhost:8081/h2-console  (admin login first)
#   JDBC URL: jdbc:h2:file:./data/vehicle-tracker   user: sa   password: (empty)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/vehicle-tracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
