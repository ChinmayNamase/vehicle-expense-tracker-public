# ---------------------------------------------------------------------------
# PROD profile: the public server (Render) with our own PostgreSQL database (Neon).
# Everything secret comes from environment variables set in the hosting dashboard:
#   DATABASE_URL           postgresql://user:password@host/dbname?sslmode=require  (from Neon)
#   ADMIN_PASSWORD         admin login for /admin.html and Swagger
#   CORS_ALLOWED_ORIGINS   the website address, e.g. https://vehicle-expense-tracker-eta.vercel.app
# ---------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-postgres.sql
spring.datasource.hikari.maximum-pool-size=5
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
