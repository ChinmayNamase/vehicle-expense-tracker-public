# Render blueprint: runs our own Java API (Spring Boot) from backend-api/Dockerfile.
# Secrets are entered in the Render dashboard, never stored here.
services:
  - type: web
    name: vehicle-tracker-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL          # paste the Neon connection string here (Render asks for it)
        sync: false
      - key: ADMIN_PASSWORD        # Render generates a random admin password; see it under Environment
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS  # the public website address
        value: https://vehicle-expense-tracker-eta.vercel.app
