<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Vehicle Expense Tracker</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" defer></script>
</head>
<body class="auth-body">
  <main class="auth-layout">
    <a class="brand auth-brand" href="index.html">
      <img src="assets/logo.svg" alt="" width="36" height="36">
      <span>Vehicle Expense Tracker</span>
    </a>
    <section class="auth-card card" aria-labelledby="auth-title">
      <h1 id="auth-title">Welcome back</h1>
      <p class="muted">Log in to track your vehicle expenses.</p>
      <form id="login-form" novalidate>
        <div class="form-message"></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
          <p class="field-error" id="password-error" aria-live="polite"></p>
        </div>
        <div class="auth-row"><a href="reset-password.html" class="link">Forgot password?</a></div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>
      <p class="auth-switch">New here? <a href="register.html" class="link">Create an account</a></p>
      <script type="module">
        import { initLoginPage } from './js/auth.js';
        initLoginPage();
      </script>
    </section>
  </main>
</body>
</html>
