<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Vehicle Expense Tracker</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" defer></script>
  <script>window.__isPasswordRecovery = /type=recovery/.test(location.hash);</script>
</head>
<body class="auth-body">
  <main class="auth-layout">
    <a class="brand auth-brand" href="index.html">
      <img src="assets/logo.svg" alt="" width="36" height="36">
      <span>Vehicle Expense Tracker</span>
    </a>
    <section class="auth-card card" aria-labelledby="auth-title">
      <h1 id="reset-title">Reset your password</h1>
      <form id="reset-request-form" novalidate>
        <p class="muted">Enter your account email and we'll send you a link to choose a new password.</p>
        <div class="form-message"></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
      <form id="reset-update-form" novalidate hidden>
        <div class="form-message"></div>
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="new-password-hint new-password-error">
          <p class="hint" id="new-password-hint">At least 8 characters, with a letter and a number.</p>
          <p class="field-error" id="new-password-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="new-confirm-password">Confirm new password</label>
          <input id="new-confirm-password" name="confirm_password" type="password" autocomplete="new-password" required aria-describedby="new-confirm-password-error">
          <p class="field-error" id="new-confirm-password-error" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>
      <p class="auth-switch"><a href="login.html" class="link">Back to login</a></p>
      <script type="module">
        import { initResetPage } from './js/auth.js';
        initResetPage();
      </script>
    </section>
  </main>
</body>
</html>
